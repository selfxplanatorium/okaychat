services:
  okaychat:
    build:
      context: .
      target: app
    image: okaychat:latest
    restart: unless-stopped
    ports:
      - "${OKAYCHAT_PORT:-8787}:8787"
    environment:
      # Required: 32+ random characters. Generate with: openssl rand -base64 32
      OKAYCHAT_SECRET: ${OKAYCHAT_SECRET:?set OKAYCHAT_SECRET in .env}
      OKAYCHAT_ALLOW_SIGNUP: ${OKAYCHAT_ALLOW_SIGNUP:-false}
      # Public URL, used for MCP OAuth redirects behind a reverse proxy. Optional.
      OKAYCHAT_PUBLIC_URL: ${OKAYCHAT_PUBLIC_URL:-}
      OKAYCHAT_SEARXNG_URL: http://searxng:8080
      OKAYCHAT_SANDBOX_URL: http://sandbox:8080
      OKAYCHAT_SANDBOX_TOKEN: ${OKAYCHAT_SANDBOX_TOKEN:?set OKAYCHAT_SANDBOX_TOKEN in .env}
      OKAYCHAT_BROWSER_URL: http://browser:8080
      # The app generates the worker's token here on first start; only the worker also mounts this volume.
      OKAYCHAT_BROWSER_TOKEN_FILE: /run/okaychat-browser/token
      OKAYCHAT_SPEECH_URL: http://speech:8080
      OKAYCHAT_SPEECH_TOKEN_FILE: /run/okaychat-speech/token
    volumes:
      - okaychat-data:/data
      - okaychat-browser-token:/run/okaychat-browser
      - okaychat-speech-token:/run/okaychat-speech
    networks: [default, sandbox, browser, speech]
    depends_on:
      - searxng
      - sandbox
      - browser
      - speech

  # Private metasearch for the web_search tool. No keys, not exposed outside the compose network.
  searxng:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-okaychat-searxng-internal}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Runs model-written code for run_code. It holds no app secrets or data, and only the app can reach it.
  # Every run gets its own network namespace with nothing but loopback, so run code has no network at all.
  # See docs/implementation/code-sandbox.md.
  sandbox:
    build: ./sandbox
    image: okaychat-sandbox:latest
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${OKAYCHAT_SANDBOX_TOKEN:?set OKAYCHAT_SANDBOX_TOKEN in .env}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-30}
    volumes:
      - okaychat-sandbox:/work
    networks: [sandbox]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    # Only what the runner needs to create workspaces and switch each run to its workspace user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus the namespace calls bubblewrap needs to build each run's jail. Runs
      # themselves get a stricter filter (sandbox/seccomp/inner.c) that denies those calls again.
      - seccomp=./sandbox/seccomp.json
      # Docker's default AppArmor profile forbids the mounts that build a run's private filesystem view.
      - apparmor=unconfined
    pids_limit: 512
    mem_limit: 2g
    cpus: 2

  # Chromium for PDFs, document previews, and the model's visual checks, and Scrapling for web_fetch's fallback.
  # No app data, provider keys, or OKAYCHAT_SECRET; a firewall in its own network namespace lets only its
  # egress proxy out, to public addresses. See docs/implementation/browser-worker.md.
  browser:
    build:
      context: .
      target: browser
    image: okaychat-browser:latest
    restart: unless-stopped
    environment:
      BROWSER_TOKEN_FILE: /run/okaychat-browser/token
    volumes:
      - okaychat-browser-token:/run/okaychat-browser:ro
    networks: [browser]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    # NET_ADMIN and CHOWN only at start (firewall, scratch directories); the entrypoint drops both, using SETPCAP,
    # before anything else runs. Long-lived root processes keep SETUID, SETGID, SETPCAP; worker users keep nothing.
    cap_add: [NET_ADMIN, CHOWN, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2

  # Local speech: Piper (read aloud, the default voice) and Whisper (speech to text) on the CPU. Each engine runs
  # in a child process started on first use and stopped after SPEECH_IDLE_MINUTES, so an idle worker holds about
  # 50 MB. Models download from Hugging Face on first use into okaychat-speech. Audio and text stay in memory.
  # No app data or secrets. See docs/implementation/speech.md.
  speech:
    build: ./speech
    image: okaychat-speech:latest
    restart: unless-stopped
    environment:
      SPEECH_TOKEN_FILE: /run/okaychat-speech/token
      SPEECH_IDLE_MINUTES: ${SPEECH_IDLE_MINUTES:-5}
    volumes:
      - okaychat-speech:/models
      - okaychat-speech-token:/run/okaychat-speech:ro
    networks: [speech]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2

networks:
  # The internal network has no route out. Run code could not use it anyway: it has no network interface.
  sandbox:
    internal: true
  # Not internal: the worker's egress proxy reaches public web pages and the artifact CDNs through it.
  browser:
  # Not internal: the speech worker downloads models from Hugging Face.
  speech:

volumes:
  okaychat-data:
  okaychat-sandbox:
  okaychat-browser-token:
  okaychat-speech:
  okaychat-speech-token:
