name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow builds and tests, it never writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Document tests render PDFs and screenshots.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # Moderate findings without an upstream fix are tracked in docs/research/security.md.
      - run: npm audit --omit=dev --audit-level=high
